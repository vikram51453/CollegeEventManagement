{% extends "base.html" %}
{% block title %}Create Event – Admin{% endblock %}

{% block content %}
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-label">Navigation</div>
    <a href="{{ url_for('admin_dashboard') }}"><span class="sidebar-icon">📊</span> Dashboard</a>
    <a href="{{ url_for('create_event') }}" class="active"><span class="sidebar-icon">➕</span> Create Event</a>
    <a href="{{ url_for('admin_registrations') }}"><span class="sidebar-icon">📋</span> Registrations</a>
    <div class="sidebar-label" style="margin-top:16px;">Student View</div>
    <a href="{{ url_for('events') }}" target="_blank"><span class="sidebar-icon">🎯</span> Events Page ↗</a>
    <div class="sidebar-label" style="margin-top:16px;">Account</div>
    <a href="{{ url_for('admin_logout') }}"><span class="sidebar-icon">🚪</span> Logout</a>
  </aside>

  <main class="admin-main">
    <div class="admin-page-title">➕ Create New Event</div>
    <div class="admin-page-sub">Fill in the details to add a new event to the system.</div>

    <div class="form-card" style="max-width:780px;margin:0;">
      <form method="POST" action="{{ url_for('create_event') }}">

        <div class="form-group">
          <label class="form-label" for="title">Event Title *</label>
          <input type="text" id="title" name="title" class="form-control"
                 placeholder="e.g. National Hackathon 2026" required maxlength="200" />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="category">Category *</label>
            <select id="category" name="category" class="form-control" required>
              <option value="">-- Select Category --</option>
              {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="max_participants">Max Participants *</label>
            <input type="number" id="max_participants" name="max_participants"
                   class="form-control" placeholder="e.g. 100" min="1" max="10000" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description *</label>
          <textarea id="description" name="description" class="form-control"
                    placeholder="Describe the event in detail…" required rows="4"></textarea>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="event_date">Event Date *</label>
            <input type="date" id="event_date" name="event_date" class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="event_time">Event Time *</label>
            <input type="time" id="event_time" name="event_time" class="form-control" required />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="venue">Venue *</label>
            <input type="text" id="venue" name="venue" class="form-control"
                   placeholder="e.g. Main Auditorium" required maxlength="200" />
          </div>
          <div class="form-group">
            <label class="form-label" for="organizer">Organizer *</label>
            <input type="text" id="organizer" name="organizer" class="form-control"
                   placeholder="e.g. CSE Department" required maxlength="200" />
          </div>
        </div>

        <div class="btn-group" style="margin-top:8px;">
          <button type="submit" class="btn btn-success">✅ Create Event</button>
          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}
